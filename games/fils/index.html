<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hack Mini-Game</title>
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SVG Definitions for Screw Gradient -->
    <svg width="0" height="0">
        <defs>
            <radialGradient id="silver-grad" cx="40%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="40%" stop-color="#cccccc" />
                <stop offset="100%" stop-color="#666666" />
            </radialGradient>
        </defs>
    </svg>

    <div id="game-wrapper">

        <!-- LCD Screen (External Hack Tool) -->
        <div id="lcd-screen">
            <div class="lcd-display">TIME<br><span id="time-val">00</span>s</div>
            <div class="lcd-display">ERROR<br><span id="err-val">0</span> / <span id="max-err-val">3</span></div>

            <div id="lcd-console" class="lcd-console">
                <span class="blink">_</span>
            </div>

            <!-- Left nodes originate directly from the tool -->
            <div id="left-nodes" class="node-column"></div>
        </div>

        <!-- Main Box -->
        <div id="game-container">

            <!-- Depth background -->
            <div id="internal-bg"></div>

            <!-- Right nodes sticking out -->
            <div id="right-nodes" class="node-column"></div>

            <svg id="wires-svg"></svg>
            <canvas id="sparks-canvas"></canvas>

            <!-- Metal Plate Phase 1 -->
            <div id="metal-plate">
                <!-- 4 Screws generated by JS -->
            </div>


        </div>
    </div>
    <script src="../../js/data.js"></script>
    <script src="../common.js"></script>
    <script src="game.js"></script>
</body>

</html>
