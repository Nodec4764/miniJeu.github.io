<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Jeu: Clavier Alarme</title>
    <!-- Use the same standard font as the Hub for consistency -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Top LEDs & Digital Timer -->
        <div class="top-indicators">
            <div class="led-panel">
                <div class="led" id="led-1"></div>
                <div class="led" id="led-2"></div>
                <div class="led" id="led-3"></div>
                <div class="led" id="led-4"></div>
            </div>
            <div class="timer-panel">
                <span id="timer-display">00:00</span>
            </div>
        </div>

        <!-- Main Interface -->
        <div class="interface-wrapper">
            
            <!-- Left Display Panel -->
            <div class="display-panel">
                <div class="display-grid" id="display-grid">
                    <!-- 16 display squares injected by JS -->
                </div>
            </div>

            <!-- Right Keypad Panel -->
            <div class="keypad-panel">
                <div class="keypad-grid" id="keypad-grid">
                    <!-- 16 buttons injected by JS -->
                </div>
            </div>

        </div>
    </div>

    <!-- External Logic -->
    <script src="../../js/data.js"></script>
    <script src="../common.js"></script>
    <script src="game.js"></script>
</body>
</html>
